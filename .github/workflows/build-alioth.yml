name: Build Poco F3 (alioth)

on:
  workflow_dispatch:
    inputs:
      ubuntu_version:
        description: 'Ubuntu runner version'
        type: choice
        options: ['22.04', '24.04', '26.04']
        default: '22.04'
      kernel_tree_preset:
        description: 'Kernel Tree'
        type: choice
        options: ['Default Kernel Tree', 're-noroi/kernel_sm8250', 'Custom URL']
        default: 'Default Kernel Tree'
      kernel_source:
        description: 'Custom Kernel Tree URL (leave empty to use preset)'
        type: string
        default: ''
      kernel_branch_preset:
        description: 'Kernel Branch'
        type: choice
        options: ['bpf-staging', 'bpf-testing', 'Custom Branch']
        default: 'bpf-staging'
      kernel_branch:
        description: 'Custom Kernel Branch (leave empty to use preset)'
        type: string
        default: ''
      ak3_source:
        description: 'AnyKernel3 URL'
        type: string
        default: 'https://github.com/re-noroi/anykernel3-test'
      ak3_branch:
        description: 'AnyKernel3 Branch'
        type: string
        default: 'main'
      zip_name:
        description: 'Zip name without .zip'
        type: string
        default: 'Aliothfake-ko-j3s'
      custom_kernel_version:
        description: 'Custom Kernel Version suffix (e.g. -FakeDreamer)'
        type: string
        default: '-FakeDreamer'
      ksu:
        description: 'KernelSU variant (SUSFS works with bakasu / sukisu only)'
        type: choice
        options: ['bakasu', 'sukisu', 'next', 'rsuntk', 'xxksu', 'midorisu']
        default: 'bakasu'
      bakasu_branch:
        description: 'BakaSU branch (used only when ksu = bakasu)'
        type: choice
        options: ['main', 'auto-hook', 'refine-flash', 'renovate/gradle-9.x', 'renovate/maven-group-in-manager', 'sync-susfs', 'sync-upstream', 'uapi/mismatch', 'weblate-main']
        default: 'main'
      ksu_patch:
        description: 'Add KernelSU (patch step). OFF = use the KSU already in the kernel'
        type: boolean
        default: true
      clean_source:
        description: 'Clean old KSU/hooks from the source first (ignored when KSU patch is OFF)'
        type: boolean
        default: true
      susfs:
        description: 'Patch SUSFS'
        type: boolean
        default: false
      rekernel:
        description: 'Re:Kernel (for tombstone apps)'
        type: boolean
        default: false
      bbg:
        description: 'Baseband Guard'
        type: boolean
        default: false
      nomount:
        description: 'Enable NoMount (external patch action)'
        type: boolean
        default: false
      vpnhide:
        description: 'Enable VPN Hide built-in backend (Linux 4.19)'
        type: boolean
        default: false
      droidspaces:
        description: 'Droidspaces (containers)'
        type: boolean
        default: false
      ntsync:
        description: 'Enable NTSYNC'
        type: boolean
        default: false
      bypass_charging:
        description: 'Enable Bypass Charging'
        type: boolean
        default: false
      rw_swappiness:
        description: 'Enable RW Swappiness'
        type: boolean
        default: false
      battery:
        description: 'Battery profile'
        type: choice
        options: ['5000-apollo', '4520-stock']
        default: '5000-apollo'

env:
  # Device env
  DEVICE_NAME: "xiaomi_alioth"
  DEVICE_CODENAME: "alioth"
  KERNEL_ARCH: "arm64"

  CUSTOM_CMDS: "LLVM=1 LLVM_IAS=1"
  EXTRA_CMDS: ""

  KERNEL_SOURCE: ${{ inputs.kernel_tree_preset == 'Custom URL' && inputs.kernel_source || inputs.kernel_tree_preset == 'Default Kernel Tree' && 'https://github.com/mohamed-ramadan-96/kernel_sm8250.git' || inputs.kernel_tree_preset == 're-noroi/kernel_sm8250' && 'https://github.com/re-noroi/kernel_sm8250' || '' }}
  KERNEL_BRANCH: ${{ inputs.kernel_branch_preset == 'Custom Branch' && inputs.kernel_branch || inputs.kernel_branch_preset != 'Custom Branch' && inputs.kernel_branch_preset || '' }}
  KSU_VARIANT: ${{ inputs.ksu }}
  SELECTED_SUSFS: ${{ inputs.susfs }}
  SELECTED_REKERNEL: ${{ inputs.rekernel }}
  SELECTED_NOMOUNT: ${{ inputs.nomount }}
  SELECTED_DROIDSPACES: ${{ inputs.droidspaces }}
  SELECTED_BBG: ${{ inputs.bbg }}
  SELECTED_NTSYNC: ${{ inputs.ntsync }}
  SELECTED_BYPASS_CHARGING: ${{ inputs.bypass_charging }}
  SELECTED_RW_SWAPPINESS: ${{ inputs.rw_swappiness }}
  SELECTED_BATTERY_PROFILE: ${{ inputs.battery }}

  CLANG_SOURCE: "https://github.com/llvm/llvm-project/releases/download/llvmorg-19.1.7/LLVM-19.1.7-Linux-X64.tar.xz"
  CLANG_BRANCH: ""

  GCC_GNU: true
  GCC_64_SOURCE: ""
  GCC_64_BRANCH: ""
  GCC_32_SOURCE: ""
  GCC_32_BRANCH: ""

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME: "vendor/alioth_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE: ${{ inputs.ksu == 'bakasu' && 'https://raw.githubusercontent.com/Baka-SU/BakaSU/refs/heads/main/kernel/setup.sh' || inputs.ksu == 'midorisu' && 'https://raw.githubusercontent.com/midori01/KernelSU/main/kernel/setup.sh' || '' }}
  KERNELSU_BRANCH: ${{ inputs.ksu == 'bakasu' && inputs.bakasu_branch || inputs.ksu == 'midorisu' && 'main' || '' }}

  KERNELSU_AUTO_GET: ${{ (inputs.ksu == 'bakasu' || inputs.ksu == 'midorisu') && 'false' || 'true' }}
  KERNELSU_AUTO_FORK: ${{ inputs.ksu }}

  SUSFS_ENABLE: ${{ inputs.susfs }}
  SUSFS_FIXED: false

  AK3_SOURCE: ${{ inputs.ak3_source }}
  AK3_BRANCH: ${{ inputs.ak3_branch }}

  ZIP_NAME: ${{ inputs.zip_name }}

  CLEAN_SOURCE: ${{ inputs.clean_source }}
  KSU_PATCH: ${{ inputs.ksu_patch }}

  BOOT_SOURCE: ""

  NEED_DTBO: false
  NEED_SAFE_DTBO: false

  ROM_TEXT: "aosp"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "AnyKernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: ${{ inputs.rekernel }}
  DROIDSPACES_ENABLE: ${{ inputs.droidspaces }}
  NOMOUNT_ENABLE: ${{ inputs.nomount }}
  VPNHIDE_SOURCE: "https://github.com/okhsunrog/vpnhide.git"
  VPNHIDE_COMMIT: "b0999b7db7356cd2b7809bb762ab92f6b507b739"

  HOOK_METHOD: ${{ inputs.ksu == 'xxksu' && 'manual' || 'syscall' }}

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: ""

  BASEBAND_GUARD_ENABLE: ${{ inputs.bbg }}
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "true"
  SKIP_PATCH: "false"

  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: alioth Ubuntu:${{ inputs.ubuntu_version }} KSU:${{ inputs.ksu }} SUSFS:${{ inputs.susfs }} NoMount:${{ inputs.nomount }} VPNHide:${{ inputs.vpnhide }} Droidspaces:${{ inputs.droidspaces }} NTSYNC:${{ inputs.ntsync }} BypassCharging:${{ inputs.bypass_charging }} RWSwappiness:${{ inputs.rw_swappiness }} ReKernel:${{ inputs.rekernel }} BBG:${{ inputs.bbg }}
    runs-on: ubuntu-${{ inputs.ubuntu_version }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: 🧪 Validate options
        shell: bash
        env:
          SUSFS_INPUT: ${{ inputs.susfs }}
          KSU_INPUT: ${{ inputs.ksu }}
          TREE_PRESET: ${{ inputs.kernel_tree_preset }}
          SOURCE_INPUT: ${{ inputs.kernel_source }}
          BRANCH_PRESET: ${{ inputs.kernel_branch_preset }}
          BRANCH_INPUT: ${{ inputs.kernel_branch }}
        run: |
          set -euo pipefail
          if [[ "$SUSFS_INPUT" == "true" && "$KSU_INPUT" != "bakasu" && "$KSU_INPUT" != "sukisu" ]]; then
            echo "::error::SUSFS is only supported with bakasu or sukisu"
            exit 1
          fi
          if [[ "$TREE_PRESET" == "Custom URL" && -z "$SOURCE_INPUT" ]]; then
            echo "::error::Custom URL selected, but Kernel Tree URL is empty"
            exit 1
          fi
          if [[ "$BRANCH_PRESET" == "Custom Branch" && -z "$BRANCH_INPUT" ]]; then
            echo "::error::Custom Branch selected, but Kernel Branch is empty"
            exit 1
          fi

      - name: 🔎 Validate kernel source
        shell: bash
        env:
          SOURCE_URL: ${{ env.KERNEL_SOURCE }}
          SOURCE_BRANCH: ${{ env.KERNEL_BRANCH }}
        run: |
          set -euo pipefail
          if [[ -z "$SOURCE_URL" || -z "$SOURCE_BRANCH" ]]; then
            echo "::error::Kernel source URL and branch must both be set."
            exit 1
          fi
          if [[ ! "$SOURCE_URL" =~ ^https://[^/[:space:]]+/.+ ]] || [[ "$SOURCE_URL" =~ [[:space:]] ]]; then
            echo "::error::Kernel source must be a GitHub HTTPS repository URL."
            exit 1
          fi
          if [[ "$SOURCE_BRANCH" =~ [[:space:]] ]]; then
            echo "::error::Kernel branch must not contain whitespace."
            exit 1
          fi
          if ! REMOTE_SHA="$(git ls-remote --exit-code "$SOURCE_URL" "refs/heads/$SOURCE_BRANCH" | awk 'NR==1 {print $1}')"; then
            echo "::error::Cannot find branch '$SOURCE_BRANCH' in '$SOURCE_URL'. Check the URL and branch."
            exit 1
          fi
          if [[ ! "$REMOTE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve a valid commit SHA for the selected kernel branch."
            exit 1
          fi
          echo "PREBUILD_KERNEL_SHA=$REMOTE_SHA" >> "$GITHUB_ENV"
          echo "[+] Source URL: $SOURCE_URL"
          echo "[+] Requested branch: $SOURCE_BRANCH"
          echo "[+] Remote branch SHA: $REMOTE_SHA"

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get necessary tools
        uses: ./.github/workflows/build-ready
      - name: 🏷️ Set custom kernel version
        shell: bash
        env:
          CUSTOM_KERNEL_VERSION: ${{ inputs.custom_kernel_version }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          DEFCONFIG="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          if [[ ! -f "$DEFCONFIG" ]]; then
            echo "::error::Defconfig not found: $DEFCONFIG"
            exit 1
          fi
          python3 - "$DEFCONFIG" "$CUSTOM_KERNEL_VERSION" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path(sys.argv[1])
          suffix = sys.argv[2]
          if "\n" in suffix or "\r" in suffix or '"' in suffix:
              raise SystemExit("Invalid kernel version suffix: quotes/newlines are not allowed.")
          text = path.read_text()
          updated, count = re.subn(r'^CONFIG_LOCALVERSION="[^"]*"$',
                                   lambda _: f'CONFIG_LOCALVERSION="{suffix}"',
                                   text, count=1, flags=re.M)
          if count != 1:
              raise SystemExit("Could not find CONFIG_LOCALVERSION in the selected defconfig.")
          path.write_text(updated)
          print(f"[+] CONFIG_LOCALVERSION set to {suffix!r}")
          PY

      - name: 🧾 Capture dependency revisions
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/dependency-revisions.txt"
          : > "$OUT"
          for dir in \
            "$GITHUB_WORKSPACE/device_kernel/AnyKernel3" \
            "$GITHUB_WORKSPACE/device_kernel/KernelSU" \
            "$GITHUB_WORKSPACE/device_kernel/KernelSU-Next" \
            "$GITHUB_WORKSPACE/device_kernel/KernelSU-rsuntk" \
            "$GITHUB_WORKSPACE/device_kernel/KernelSU-xxKSU" \
            "$GITHUB_WORKSPACE/device_kernel/KernelSU-SukiSU-Ultra" \
            "$GITHUB_WORKSPACE/device_kernel/KernelSU-BakaSU" \
            "$GITHUB_WORKSPACE/mkboottools"; do
            if [[ -e "$dir/.git" ]] && SHA="$(git -C "$dir" rev-parse HEAD 2>/dev/null)"; then
              printf '%s=%s\n' "${dir#"$GITHUB_WORKSPACE/"}" "$SHA" | tee -a "$OUT"
            fi
          done
          if [[ ! -s "$OUT" ]]; then
            echo "No separately cloned Git dependencies detected." | tee "$OUT"
          fi

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          D="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          chmod +x scripts/config

          # xxksu hooks are built with KSU_HACK_ARM64_BRANCH_LINK
          if [ "${{ inputs.ksu }}" == "xxksu" ]; then
            ./scripts/config --file "$D" --enable CONFIG_KSU_HACK_ARM64_BRANCH_LINK
          fi

          # BakaSU calls security_dump_masked_av, which is only built with CONFIG_AUDIT
          ./scripts/config --file "$D" --enable CONFIG_AUDIT

          # SUSFS SUS_MAP and uname spoof
          ./scripts/config --file "$D" --enable CONFIG_KSU_SUSFS_SUS_MAP --enable CONFIG_KSU_SUSFS_SPOOF_UNAME

          # Official LLVM is built without MLGO, so disable these flags.
          sed -i -e '/regalloc-enable-advisor/s/^/#/' -e '/enable-ml-inliner/s/^/#/' Makefile

          # BakaSU needs these two symbols non-static.
          sed -i 's/^static const struct file_operations sel_handle_status_ops/const struct file_operations sel_handle_status_ops/' security/selinux/selinuxfs.c
          sed -i 's/^static ssize_t (\*const write_op\[\])(/ssize_t (*const write_op[])(/' security/selinux/selinuxfs.c

          # NTSYNC
          if [ "${{ inputs.ntsync }}" == "true" ]; then
            ./scripts/config --file "$D" --enable CONFIG_NTSYNC
          else
            ./scripts/config --file "$D" --disable CONFIG_NTSYNC
          fi

          # Bypass Charging
          if [ "${{ inputs.bypass_charging }}" == "true" ]; then
            ./scripts/config --file "$D" --enable CONFIG_BYPASS_CHARGING
          else
            ./scripts/config --file "$D" --disable CONFIG_BYPASS_CHARGING
          fi

          # RW Swappiness
          if [ "${{ inputs.rw_swappiness }}" == "true" ]; then
            ./scripts/config --file "$D" --enable CONFIG_RW_SWAPPINESS
          else
            ./scripts/config --file "$D" --disable CONFIG_RW_SWAPPINESS
          fi

      - name: 🔋 Battery variant
        if: ${{ inputs.battery == '4520-stock' }}
        run: |
          cd "$GITHUB_WORKSPACE/device_kernel"
          sed -i -e '/qcom,j3s-batt-profile;/d' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi
          sed -i -e '/fg-gen4-batterydata-apollo-sun-5000mah.dtsi/d' arch/arm64/boot/dts/vendor/qcom/alioth-sm8250.dtsi

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🛡️ Patch Kernel of NoMount
        uses: ./.github/workflows/patch-nomount

      - name: 🐍 Set up Python 3.12 for VPN Hide integration
        if: ${{ inputs.vpnhide }}
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 🛡️ Integrate VPN Hide built-in backend
        if: ${{ inputs.vpnhide }}
        shell: bash
        env:
          VPNHIDE_SOURCE_URL: ${{ env.VPNHIDE_SOURCE }}
          VPNHIDE_EXPECTED_COMMIT: ${{ env.VPNHIDE_COMMIT }}
        run: |
          set -euo pipefail
          KERNEL_DIR="$GITHUB_WORKSPACE/device_kernel"
          VPNHIDE_DIR="$RUNNER_TEMP/vpnhide-source"
          REVIEW_DIR="$RUNNER_TEMP/vpnhide-integration-review"
          DEFCONFIG="$KERNEL_DIR/arch/${KERNEL_ARCH}/configs/${DEFCONFIG_NAME}"

          echo "::group::[+] Fetching pinned VPN Hide source"
          git clone --depth=1 "$VPNHIDE_SOURCE_URL" "$VPNHIDE_DIR"
          ACTUAL_VPNHIDE_COMMIT="$(git -C "$VPNHIDE_DIR" rev-parse HEAD)"
          if [[ "$ACTUAL_VPNHIDE_COMMIT" != "$VPNHIDE_EXPECTED_COMMIT" ]]; then
            echo "::error::VPN Hide source revision mismatch. Expected $VPNHIDE_EXPECTED_COMMIT, got $ACTUAL_VPNHIDE_COMMIT."
            exit 1
          fi
          echo "VPNHIDE_SOURCE_SHA=$ACTUAL_VPNHIDE_COMMIT" >> "$GITHUB_ENV"
          echo "[+] Pinned VPN Hide revision: $ACTUAL_VPNHIDE_COMMIT"
          echo "::endgroup::"

          echo "::group::[+] Apply VPN Hide for Linux 4.19"
          # Linux 4.19 trees may carry the later sockptr API as a backport.
          # Add a CI-local rule overlay only when that exact API shape is detected.
          export VPNHIDE_KERNEL_DIR="$KERNEL_DIR"
          python - "$VPNHIDE_DIR/builtin/scripts/integration_rules.py" <<'PY'
          import os
          import pathlib
          import sys
          import textwrap

          rules_path = pathlib.Path(sys.argv[1])
          kernel = pathlib.Path(os.environ["VPNHIDE_KERNEL_DIR"])
          socket_path = kernel / "net/socket.c"
          socket_text = socket_path.read_text()
          sockptr_header = kernel / "include/linux/sockptr.h"

          if sockptr_header.is_file() and "USER_SOCKPTR(optval)" in socket_text:
              expected_dispatch = (
                  "\t\tif (level == SOL_SOCKET)\n"
                  "\t\t\terr =\n"
                  "\t\t\t    sock_setsockopt(sock, level, optname, USER_SOCKPTR(optval),\n"
                  "\t\t\t\t\t    optlen);\n"
              )
              if "BPF_CGROUP_RUN_PROG_SETSOCKOPT" not in socket_text or expected_dispatch not in socket_text:
                  raise SystemExit("Detected sockptr.h/USER_SOCKPTR but the setsockopt dispatch is not the verified BPF-backport shape; refusing an unsafe VPN Hide patch.")

              # The pinned VPN Hide header gates sockptr_t by kernel version.
              # This tree is 4.19 but has the API backported, so explicitly mark
              # that capability in the copied header as well as in socket.c.
              vpnhide_header = pathlib.Path(sys.argv[1]).parents[1] / "include/linux/vpnhide.h"
              header_text = vpnhide_header.read_text()
              version_gate = "#if LINUX_VERSION_CODE >= KERNEL_VERSION(5, 9, 0)"
              if "VPNHIDE_BACKPORT_SOCKPTR" not in header_text:
                  if header_text.count(version_gate) != 1 or header_text.count("#define _LINUX_VPNHIDE_H") != 1:
                      raise SystemExit("Could not safely mark VPN Hide's sockptr capability in its public header.")
                  header_text = header_text.replace(
                      "#define _LINUX_VPNHIDE_H",
                      "#define _LINUX_VPNHIDE_H\\n\\n#define VPNHIDE_BACKPORT_SOCKPTR 1",
                      1,
                  )
                  header_text = header_text.replace(
                      version_gate,
                      version_gate + " || defined(VPNHIDE_BACKPORT_SOCKPTR)",
                      1,
                  )
                  vpnhide_header.write_text(header_text)

              overlay = textwrap.dedent(r'''

          # CI-local compatibility for Linux 4.19 trees backported to sockptr_t.
          # The interception runs after BPF cgroup processing and preserves the
          # kernel_optval path. FROZEN uses KERNEL_SOCKPTR, avoiding set_fs().
          import os as _vpnhide_os
          from pathlib import Path as _vpnhide_Path
          _vpnhide_socket = (_vpnhide_Path(_vpnhide_os.environ["VPNHIDE_KERNEL_DIR"]) / "net/socket.c").read_text()
          _vpnhide_expected = (
              "\t\tif (level == SOL_SOCKET)\n"
              "\t\t\terr =\n"
              "\t\t\t    sock_setsockopt(sock, level, optname, USER_SOCKPTR(optval),\n"
              "\t\t\t\t\t    optlen);\n"
          )
          if _vpnhide_expected not in _vpnhide_socket:
              raise RuntimeError("sockptr backport dispatch changed after compatibility detection")
          _vpnhide_rules = EDITS["android10-4.19"]["net/socket.c"]
          _vpnhide_rules[1] = (
              "\tint err, fput_needed;\n\tstruct socket *sock;\n",
              "\tint err, fput_needed;\n\tstruct socket *sock;\n"
              "\tunion vpnhide_bind_snapshot vh_snap;\n",
          )
          _vpnhide_rules[2] = (
              _vpnhide_expected,
              "\t\tif (level == SOL_SOCKET) {\n"
              "\t\t\tenum vpnhide_bind_action vh_act;\n"
              "\t\t\tsockptr_t vh_optval = USER_SOCKPTR(optval);\n"
              "\t\t\tvh_act = vpnhide_setsockopt_bind(sock->sk, optname,\n"
              "\t\t\t\t\t\t vh_optval, optlen, &vh_snap);\n"
              "\t\t\tif (vh_act == VPNHIDE_BIND_DENY) {\n"
              "\t\t\t\terr = -ENODEV;\n"
              "\t\t\t\tgoto out_put;\n"
              "\t\t\t}\n"
              "\t\t\tif (vh_act == VPNHIDE_BIND_FAULT) {\n"
              "\t\t\t\terr = -EFAULT;\n"
              "\t\t\t\tgoto out_put;\n"
              "\t\t\t}\n"
              "\t\t\tif (vh_act == VPNHIDE_BIND_FROZEN)\n"
              "\t\t\t\tvh_optval = KERNEL_SOCKPTR(&vh_snap);\n"
              "\t\t\terr = sock_setsockopt(sock, level, optname, vh_optval, optlen);\n"
              "\t\t}\n",
          )
          _vpnhide_rules[3] = (
              "\t\t\terr =\n"
              "\t\t\t    sock->ops->setsockopt(sock, level, optname, optval,\n"
              "\t\t\t\t\t  optlen);\n"
              "out_put:\n",
              "\t\t\terr =\n"
              "\t\t\t    sock->ops->setsockopt(sock, level, optname, optval,\n"
              "\t\t\t\t\t  optlen);\n"
              "out_put:\n",
          )
          '''
              current = rules_path.read_text()
              marker = "CI-local compatibility for Linux 4.19 trees backported to sockptr_t."
              if marker not in current:
                  rules_path.write_text(current + overlay)
              print("[+] Applied verified Linux 4.19 sockptr backport rules.")
          elif "USER_SOCKPTR(optval)" in socket_text or sockptr_header.exists():
              raise SystemExit("Partial/unknown sockptr backport detected; refusing to guess the VPN Hide socket integration.")
          else:
              print("[i] No sockptr backport detected; using the upstream android10-4.19 rules.")
          PY

          python "$VPNHIDE_DIR/builtin/scripts/integrate.py" apply \
            --kernel "$KERNEL_DIR" \
            --kmi android10-4.19 \
            --output "$REVIEW_DIR"

          if [[ ! -x "$KERNEL_DIR/scripts/config" ]]; then
            chmod +x "$KERNEL_DIR/scripts/config"
          fi
          "$KERNEL_DIR/scripts/config" --file "$DEFCONFIG" --enable CONFIG_VPNHIDE
          grep -qx 'CONFIG_VPNHIDE=y' "$DEFCONFIG" || {
            echo "::error::CONFIG_VPNHIDE=y was not written to the selected defconfig."
            exit 1
          }
          test -s "$KERNEL_DIR/security/vpnhide/core.c"
          test -s "$KERNEL_DIR/include/linux/vpnhide.h"
          echo "[+] VPN Hide built-in integration and defconfig option are ready."
          echo "::endgroup::"

      - name: 📦 Upload VPN Hide integration review
        if: ${{ inputs.vpnhide && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: vpnhide-integration-review
          path: ${{ runner.temp }}/vpnhide-integration-review/
          if-no-files-found: error

      - name: 🧾 Audit patch results
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"

          # Any leftover reject/original files indicate a patch that needs review.
          mapfile -t PATCH_ARTIFACTS < <(find . -type f \( -name '*.rej' -o -name '*.orig' \) -print)
          if (( ${#PATCH_ARTIFACTS[@]} > 0 )); then
            ARCHIVE="rej_files_audit_${GITHUB_RUN_ID:-local}.tar.gz"
            tar -czf "$ARCHIVE" -- "${PATCH_ARTIFACTS[@]}"
            echo "::error::Patch residue detected; refusing to compile with rejected or backup files."
            printf '[-] Patch residue: %s\n' "${PATCH_ARTIFACTS[@]}"
            echo "[+] Patch diagnostics saved to $ARCHIVE."
            exit 1
          fi

          # Re:Kernel's patch script can report that its source marker is absent
          # even when its patching flow is expected to continue on this kernel.
          # Do not fail the build based on a broad text-marker search here.
          if [[ "${{ inputs.rekernel }}" == "true" ]]; then
            echo "[i] Re:Kernel was requested; relying on the patch action output and build/config checks."
          fi
          if [[ "${{ inputs.nomount }}" == "true" ]] && ! grep -Rqs --include='*.c' --include='*.h' 'NOMOUNT' fs include kernel drivers; then
            echo "::error::NoMount was requested but no NoMount source marker was found."
            exit 1
          fi
          if [[ "${{ inputs.vpnhide }}" == "true" ]] && [[ ! -s security/vpnhide/core.c || ! -s include/linux/vpnhide.h ]]; then
            echo "::error::VPN Hide was requested but its built-in source/header is missing."
            exit 1
          fi
          echo "[+] Patch audit passed; no .rej/.orig files remain."

      - name: 🩹 Fix MidoriSU compatibility on older kernels
        if: ${{ inputs.ksu == 'midorisu' }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          INIT_FILE="drivers/kernelsu/core/init.c"
          SUCOMPAT_FILE="drivers/kernelsu/feature/sucompat.c"
          SYSCALL_HOOK_FILE="drivers/kernelsu/hook/syscall_hook_manager.c"
          PATCH_MEMORY_FILE="drivers/kernelsu/hook/arm64/patch_memory.c"
          for FILE in "$INIT_FILE" "$SUCOMPAT_FILE" "$SYSCALL_HOOK_FILE" "$PATCH_MEMORY_FILE"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::MidoriSU source not found: $FILE"
              exit 1
            fi
          done
          python3 - "$INIT_FILE" "$SUCOMPAT_FILE" "$SYSCALL_HOOK_FILE" "$PATCH_MEMORY_FILE" <<'PY'
          import pathlib, sys

          init_path = pathlib.Path(sys.argv[1])
          init_text = init_path.read_text()
          old_ns = "MODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);"
          new_ns = "#ifdef MODULE_IMPORT_NS\nMODULE_IMPORT_NS(VFS_internal_I_am_really_a_filesystem_and_am_NOT_a_driver);\n#endif"
          if new_ns in init_text:
              print("[+] MODULE_IMPORT_NS compatibility guard already present.")
          elif old_ns in init_text:
              init_path.write_text(init_text.replace(old_ns, new_ns, 1))
              print("[+] Guarded MODULE_IMPORT_NS for older kernels.")
          else:
              raise SystemExit("::error::Expected MODULE_IMPORT_NS line not found; refusing to modify unexpected source.")

          sucompat_path = pathlib.Path(sys.argv[2])
          sucompat_text = sucompat_path.read_text()
          pgtable_include = "#include <linux/pgtable.h>"
          guarded_pgtable_include = "#if __has_include(<linux/pgtable.h>)\n#include <linux/pgtable.h>\n#endif"
          if guarded_pgtable_include in sucompat_text:
              print("[+] linux/pgtable.h compatibility guard already present.")
          elif pgtable_include in sucompat_text:
              sucompat_path.write_text(sucompat_text.replace(pgtable_include, guarded_pgtable_include, 1))
              print("[+] Guarded linux/pgtable.h include for kernels that do not provide it.")
          else:
              raise SystemExit("::error::Expected linux/pgtable.h include not found; refusing to modify unexpected source.")

          syscall_hook_path = pathlib.Path(sys.argv[3])
          syscall_hook_text = syscall_hook_path.read_text()
          old_registration = "register_trace_prio_sys_enter(ksu_sys_enter_handler, NULL, INT_MIN)"
          compatible_registration = "register_trace_sys_enter(ksu_sys_enter_handler, NULL)"
          import re
          if re.search(r"(?m)^\s*ret\s*=\s*register_trace_sys_enter\(ksu_sys_enter_handler,\s*NULL\)", syscall_hook_text):
              print("[+] sys_enter registration already uses the older-kernel-compatible API.")
          elif old_registration in syscall_hook_text:
              syscall_hook_path.write_text(syscall_hook_text.replace(old_registration, compatible_registration, 1))
              print("[+] Replaced priority sys_enter registration with the compatible registration API.")
          else:
              raise SystemExit("::error::Expected sys_enter registration not found; refusing to modify unexpected source.")

          patch_memory_path = pathlib.Path(sys.argv[4])
          patch_memory_text = patch_memory_path.read_text()
          old_copy = "copy_to_kernel_nofault(map, src, len)"
          compatible_copy = "probe_kernel_write(map, src, len)"
          if compatible_copy in patch_memory_text:
              print("[+] Kernel memory write already uses probe_kernel_write for older kernels.")
          elif old_copy in patch_memory_text:
              patch_memory_path.write_text(patch_memory_text.replace(old_copy, compatible_copy, 1))
              print("[+] Replaced copy_to_kernel_nofault with probe_kernel_write for Linux 4.19 compatibility.")
          else:
              raise SystemExit("::error::Expected kernel nofault copy call not found; refusing to modify unexpected source.")
          PY
          grep -n -B1 -A2 'MODULE_IMPORT_NS' "$INIT_FILE"
          grep -n -B1 -A2 'pgtable.h' "$SUCOMPAT_FILE"
          grep -n -B2 -A2 'register_trace_.*sys_enter' "$SYSCALL_HOOK_FILE"
          grep -n -B2 -A2 'probe_kernel_write\|copy_to_kernel_nofault' "$PATCH_MEMORY_FILE"

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: ✅ Verify config
        shell: bash
        env:
          WANT_SUSFS: ${{ inputs.susfs }}
          WANT_REKERNEL: ${{ inputs.rekernel }}
          WANT_NOMOUNT: ${{ inputs.nomount }}
          WANT_DROIDSPACES: ${{ inputs.droidspaces }}
          WANT_BBG: ${{ inputs.bbg }}
          WANT_NTSYNC: ${{ inputs.ntsync }}
          WANT_BYPASS_CHARGING: ${{ inputs.bypass_charging }}
          WANT_RW_SWAPPINESS: ${{ inputs.rw_swappiness }}
          WANT_VPNHIDE: ${{ inputs.vpnhide }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel"
          test -s out/.config || { echo "::error::out/.config is missing."; exit 1; }

          verify_enabled() {
            local symbol="$1"
            if ! grep -qx "$symbol=y" out/.config; then
              echo "::error::Requested feature is enabled in workflow inputs but $symbol is not enabled in out/.config."
              exit 1
            fi
            echo "[+] Verified $symbol=y"
          }

          [[ "$WANT_SUSFS" != "true" ]] || verify_enabled CONFIG_KSU_SUSFS
          [[ "$WANT_SUSFS" != "true" ]] || verify_enabled CONFIG_KSU_SUSFS_PRIORITY_UID_FILTER
          [[ "$WANT_REKERNEL" != "true" ]] || verify_enabled CONFIG_REKERNEL
          [[ "$WANT_NOMOUNT" != "true" ]] || verify_enabled CONFIG_NOMOUNT
          [[ "$WANT_BBG" != "true" ]] || verify_enabled CONFIG_BBG
          [[ "$WANT_NTSYNC" != "true" ]] || verify_enabled CONFIG_NTSYNC
          [[ "$WANT_BYPASS_CHARGING" != "true" ]] || verify_enabled CONFIG_BYPASS_CHARGING
          [[ "$WANT_RW_SWAPPINESS" != "true" ]] || verify_enabled CONFIG_RW_SWAPPINESS
          [[ "$WANT_VPNHIDE" != "true" ]] || verify_enabled CONFIG_VPNHIDE

          if [[ "$WANT_DROIDSPACES" == "true" ]]; then
            test -s arch/arm64/configs/droidspaces.config || { echo "::error::Droidspaces config is missing."; exit 1; }
            echo "[+] Verified Droidspaces config is present."
          fi

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: 📦 Validate package and generate checksums
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$GITHUB_WORKSPACE/device_kernel/${PACK_NAME:?PACK_NAME was not set by pack step}"
          if [[ ! -s "$PACKAGE" ]]; then
            echo "::error::Expected package was not created: $PACKAGE"
            exit 1
          fi
          case "$PACKAGE" in
            *.zip)
              unzip -t "$PACKAGE"
              if ! unzip -Z1 "$PACKAGE" | grep -Eq '(^|/)(Image|Image\.gz|Image\.gz-dtb|Image-dtb)$'; then
                echo "::error::Package does not contain a recognized kernel image."
                exit 1
              fi
              ;;
            *.img)
              file "$PACKAGE"
              ;;
            *)
              echo "::error::Unexpected package extension: $PACKAGE"
              exit 1
              ;;
          esac
          sha256sum "$PACKAGE" | tee "$PACKAGE.sha256"
          {
            echo "package=$(basename "$PACKAGE")"
            echo "ubuntu_runner=ubuntu-${{ inputs.ubuntu_version }}"
            . /etc/os-release
            echo "ubuntu_version=$VERSION_ID"
            echo "sha256=$(sha256sum "$PACKAGE" | awk '{print $1}')"
            echo "kernel_source=$KERNEL_SOURCE_URL"
            echo "kernel_branch=$KERNEL_SOURCE_BRANCH"
            echo "kernel_commit=$KERNEL_SOURCE_SHA"
            echo "workflow_commit=$GITHUB_SHA"
            echo "build_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "device=$DEVICE_CODENAME"
            echo "kernel_version=$KERNEL_VERSION"
            echo "kernelsu_variant=${{ inputs.ksu }}"
            echo "susfs=${{ inputs.susfs }}"
            echo "rekernel=${{ inputs.rekernel }}"
            echo "nomount=${{ inputs.nomount }}"
            echo "droidspaces=${{ inputs.droidspaces }}"
            echo "baseband_guard=${{ inputs.bbg }}"
            echo "ntsync=${{ inputs.ntsync }}"
            echo "bypass_charging=${{ inputs.bypass_charging }}"
            echo "rw_swappiness=${{ inputs.rw_swappiness }}"
            echo "vpnhide=${{ inputs.vpnhide }}"
            echo "vpnhide_source_sha=${VPNHIDE_SOURCE_SHA:-disabled}"
          } > "$GITHUB_WORKSPACE/device_kernel/build-info.txt"
          echo "[+] Package validated: $PACKAGE"

      - name: 📄 Upload build metadata and checksums
        uses: actions/upload-artifact@v7
        with:
          name: alioth-build-metadata
          path: |
            device_kernel/build-info.txt
            dependency-revisions.txt
            device_kernel/${{ env.PACK_NAME }}.sha256
          if-no-files-found: error

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files

      - name: 🧯 Upload failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: alioth-failure-diagnostics
          path: |
            device_kernel/error.log
            device_kernel/out/.config
            device_kernel/build-info.txt
            device_kernel/*.rej
            device_kernel/*.orig
            device_kernel/**/*.rej
            device_kernel/**/*.orig
            device_kernel/rej_files_*.tar.gz
            device_kernel/susfs-patch.log
            device_kernel/compile_commands.json
            ${{ runner.temp }}/vpnhide-integration-review/
          if-no-files-found: warn
