name: 'Patch Baseband Guard for Kernel.'

runs:
  using: 'composite'
  steps:
      - name: Patch Baseband Guard
        if: env.BASEBAND_GUARD_ENABLE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/device_kernel/"
          wget -qO- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          if [[ "${{ env.BASEBAND_GUARD_BOOT }}" == "true" ]]; then
            echo "CONFIG_BBG_BLOCK_BOOT=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          fi

          if grep -q "DEFINE_LSM" "include/linux/lsm_hooks.h" && ! grep -q "baseband_guard" "./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"; then
            echo "=======Detect======="
            echo "= Found DEFINE_LSM ="
            echo "===================="

            if ! grep -rq "CONFIG_LSM=" "./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}" && grep -q "bpf" "./security/Kconfig"; then
                echo "[-] Have not found default CONFIG_LSM values, and detected bpf."
                echo 'CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,bpf,baseband_guard"' >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            elif ! grep -rq "CONFIG_LSM=" "./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}"; then
                echo "[-] Have not found default CONFIG_LSM values."
                echo 'CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,smack,tomoyo,apparmor,baseband_guard"' >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            else
                echo "[+] Found default CONFIG_LSM values."
                sed -i 's/\(CONFIG_LSM="[^"]*\)"/\1,baseband_guard"/' ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
            fi

          fi

          # Ignore historical .rej files tracked by the kernel source.
          # Fail only when Baseband Guard creates a new reject or modifies an existing one.
          PATCH_REJECTS=()
          while IFS= read -r -d '' reject; do
            if git ls-files --error-unmatch -- "$reject" >/dev/null 2>&1; then
              if ! git diff --quiet HEAD -- "$reject" || ! git diff --cached --quiet -- "$reject"; then
                PATCH_REJECTS+=("$reject")
              fi
            else
              PATCH_REJECTS+=("$reject")
            fi
          done < <(find . -type f -name '*.rej' -print0)

          if (( ${#PATCH_REJECTS[@]} > 0 )); then
            echo "::error::Baseband Guard created or modified patch reject files; refusing to continue."
            printf '[-] Patch reject: %s\n' "${PATCH_REJECTS[@]}"
            exit 1
          fi
          echo "[+] Patched Baseband Guard for your kernel successfully."
